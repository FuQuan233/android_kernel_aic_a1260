%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6580-spm-suspend.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 SPM suspend controller

maintainers:
  - FuQuan <i@fuquan.moe>

description: |
  Child of the MT6580 SCPSYS power controller. Shares the parent's SPM
  register resource for PCM instruction loading and sleep sequencing;
  MTCMOS power domains remain owned by SCPSYS. The PMIC wrapper supplies
  the autonomous suspend command slots. The PCM return interrupt provides
  timer wakeup. Standby supports staged qualification; automatic deep
  selects the qualified CPU0/infra/DDRPHY and clock handoff profile, with
  retention fallback when prerequisites are busy before hardware entry.

properties:
  mediatek,vproc-retention:
    type: boolean
    description: |
      Opt into the board-qualified MT6350 VPROC hardware sleep policy for
      automatic mem/deep. The provider borrows hardware voltage control,
      the 0.85 V sleep selector and SRCLKEN/oscillator clock handoff only
      across suspend, restoring software ownership before CPUFreq resumes.
      Requires the qualified 1.15 V suspend OPP and matching software/on/
      sleep baseline selectors; unsupported firmware-owned baselines keep
      their existing policy. This is not an active CPU undervolt setting.

  compatible:
    const: mediatek,mt6580-spm-suspend

  mediatek,pwrap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MT6580 PMIC wrapper providing the MT6350 suspend command slots

  mediatek,ddr:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Read-only DDR clock provider auditing BSP SPM prerequisites

  mediatek,clock-controllers:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 2
    maxItems: 2
    items:
      maxItems: 1
    description:
      TOPCKGEN followed by APMIXED providers for guarded AXI source
      parking and MAINPLL power control during deep and explicit standby.

  mediatek,uarts:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 2
    items:
      maxItems: 1
    description: All enabled MT6580 UART controllers requiring sleep handshake

  interrupts:
    maxItems: 1
    description: SPM IRQ0, used for PCM return and timer wakeup

  mediatek,usbs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
    items:
      maxItems: 1
    description: All enabled MT6580 USB controllers requiring PHY/clock shutdown

  clocks:
    maxItems: 1
    description: SPM register clock

  clock-names:
    const: spm

required:
  - compatible
  - mediatek,pwrap
  - mediatek,ddr
  - mediatek,uarts
  - mediatek,usbs
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/mt6580-clk.h>

    suspend {
        compatible = "mediatek,mt6580-spm-suspend";
        mediatek,pwrap = <&pwrap>;
        mediatek,ddr = <&ddrclk>;
        mediatek,uarts = <&uart0>;
        mediatek,usbs = <&usb>;
        mediatek,clock-controllers = <&topckgen>, <&apmixedsys>;
        interrupts = <GIC_SPI 88 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&topckgen CLK_MT6580_TOP_SPM>;
        clock-names = "spm";
    };
