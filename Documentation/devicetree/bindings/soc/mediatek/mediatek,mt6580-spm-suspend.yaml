%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6580-spm-suspend.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 SPM suspend controller

maintainers:
  - FuQuan <i@fuquan.moe>

description: |
  Child of the MT6580 SCPSYS power controller. Shares the parent's SPM
  register resource for PCM instruction loading and sleep sequencing;
  MTCMOS power domains remain owned by SCPSYS. The PMIC wrapper supplies
  the autonomous suspend command slots. The PCM return interrupt provides
  timer wakeup. Retained-state standby keeps CPU0, infra and DDR powered.

properties:
  compatible:
    const: mediatek,mt6580-spm-suspend

  mediatek,pwrap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: MT6580 PMIC wrapper providing the MT6350 suspend command slots

  mediatek,uarts:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 2
    items:
      maxItems: 1
    description: All enabled MT6580 UART controllers requiring sleep handshake

  interrupts:
    maxItems: 1
    description: SPM IRQ0, used for PCM return and timer wakeup

  mediatek,usbs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
    items:
      maxItems: 1
    description: All enabled MT6580 USB controllers requiring PHY/clock shutdown

  clocks:
    maxItems: 1
    description: SPM register clock

  clock-names:
    const: spm

required:
  - compatible
  - mediatek,pwrap
  - mediatek,uarts
  - mediatek,usbs
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/mt6580-clk.h>

    suspend {
        compatible = "mediatek,mt6580-spm-suspend";
        mediatek,pwrap = <&pwrap>;
        mediatek,uarts = <&uart0>;
        mediatek,usbs = <&usb>;
        interrupts = <GIC_SPI 88 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&topckgen CLK_MT6580_TOP_SPM>;
        clock-names = "spm";
    };
