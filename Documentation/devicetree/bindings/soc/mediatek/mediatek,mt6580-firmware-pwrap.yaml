%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6580-firmware-pwrap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MT6580 firmware-initialized MT6350 PMIC wrapper

maintainers:
  - FuQuan <i@fuquan.moe>

description: |
  Provides serialized MT6350 register access over the WACS2 channel configured
  by firmware. This bring-up driver does not initialize or reset PWRAP.

properties:
  compatible:
    const: mediatek,mt6580-firmware-pwrap
  reg:
    maxItems: 1
  reboot-mode:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: wingtech,wt6580-reboot-mode
    required:
      - compatible
  regulators:
    $ref: /schemas/regulator/mediatek,mt6350-regulator.yaml#
  pmic:
    $ref: /schemas/mfd/mediatek,mt6397.yaml#

required:
  - compatible
  - reg

additionalProperties: false
