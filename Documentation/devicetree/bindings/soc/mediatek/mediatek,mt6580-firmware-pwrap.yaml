%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6580-firmware-pwrap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MT6580 MT6350 PMIC wrapper

maintainers:
  - FuQuan <i@fuquan.moe>

description: |
  Provides serialized MT6350 register access over WACS2. The firmware-pwrap
  compatible requires an initialized link and never initializes or resets it.
  The mt6580-pwrap compatible can initialize an unconfigured link before any
  PMIC consumers are registered, using the TOPRGU SPI reset and TOPCKGEN
  gates. An already initialized link is retained during normal startup.
  When clocks are supplied, they remain enabled for PMIC IRQ, regulator and
  final power-off register access throughout the wrapper's lifetime.

properties:
  compatible:
    enum:
      - mediatek,mt6580-firmware-pwrap
      - mediatek,mt6580-pwrap
  reg:
    maxItems: 1
  clocks:
    items:
      - description: AP PMIC SPI clock using the firmware-selected source
      - description: PMIC 26 MHz clock
  clock-names:
    items:
      - const: spi
      - const: 26m
  resets:
    maxItems: 1
  reset-names:
    const: spi
  mediatek,topckgen:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      MT6580 TOPCKGEN supplier owning the SET/CLR gates and PMIC bclk DCM
      control used around the initial PWRAP SPI reset.
  reboot-mode:
    type: object
    additionalProperties: false
    properties:
      compatible:
        const: wingtech,wt6580-reboot-mode
    required:
      - compatible
  regulators:
    $ref: /schemas/regulator/mediatek,mt6350-regulator.yaml#
  pmic:
    $ref: /schemas/mfd/mediatek,mt6397.yaml#

required:
  - compatible
  - reg

dependencies:
  clocks: [clock-names]
  clock-names: [clocks]
  resets: [reset-names]
  reset-names: [resets]

allOf:
  - if:
      properties:
        compatible:
          const: mediatek,mt6580-pwrap
    then:
      required:
        - clocks
        - clock-names
        - resets
        - reset-names
        - mediatek,topckgen

additionalProperties: false
