%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6580-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 pin controller

maintainers:
  - FuQuan <i@fuquan.moe>

description: |
  GPIO, pin multiplexing, IOCFG and external interrupts on MT6580. GPIO0..15
  have direct EINT mappings; other pins share interrupt channels and their
  routing is not supported yet.

allOf:
  - $ref: pinctrl.yaml#

properties:
  compatible:
    const: mediatek,mt6580-pinctrl
  reg:
    maxItems: 6
  reg-names:
    items:
      - const: gpio
      - const: iocfg-t
      - const: iocfg-b
      - const: iocfg-l
      - const: iocfg-r
      - const: eint
  gpio-controller: true
  '#gpio-cells':
    const: 2
  gpio-ranges:
    maxItems: 1
  interrupt-controller: true
  '#interrupt-cells':
    const: 2
  interrupts:
    maxItems: 1

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false
    patternProperties:
      '^pins':
        type: object
        allOf:
          - $ref: pincfg-node.yaml#
          - $ref: pinmux-node.yaml#
        properties:
          pinmux: true
          bias-disable: true
          bias-pull-up: true
          bias-pull-down: true
          input-enable: true
          input-disable: true
          input-schmitt-enable: true
          input-schmitt-disable: true
          output-low: true
          output-high: true
        required:
          - pinmux
        additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges
  - interrupt-controller
  - '#interrupt-cells'
  - interrupts

additionalProperties: false
