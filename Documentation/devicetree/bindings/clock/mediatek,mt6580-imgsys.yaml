%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6580-imgsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 image subsystem clock controller

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>

description:
  IMGSYS provides the LARB1 and shared video codec gates in the ISP power
  domain. Clock indices are defined in dt-bindings/clock/mt6580-clk.h.
  The physical upstream routing is not established by this binding.

properties:
  compatible:
    const: mediatek,mt6580-imgsys

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - '#clock-cells'
  - power-domains

additionalProperties: false
