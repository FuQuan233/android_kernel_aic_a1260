%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6580-ddrphy-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 firmware memory clock

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>

description:
  Read-only provider for the firmware-programmed EMI memory source. PLL fields
  are distributed across DDRPHY and the DRAMC AO/NAO register mirrors. The clock
  rate is one quarter of the DDR data rate. This provider does not reprogram
  memory timings, switch PLL modes or implement DDR self-refresh.

properties:
  compatible:
    const: mediatek,mt6580-ddrphy-clock

  reg:
    items:
      - description: DDRPHY registers
      - description: DRAMC always-on register mirror
      - description: DRAMC non-always-on register mirror

  reg-names:
    items:
      - const: ddrphy
      - const: dramc-ao
      - const: dramc-nao

  clocks:
    maxItems: 1

  clock-names:
    const: xtal

  '#clock-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false
