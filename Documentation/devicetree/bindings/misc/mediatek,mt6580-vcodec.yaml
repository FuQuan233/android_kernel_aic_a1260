%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/mediatek,mt6580-vcodec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6580 video codec

maintainers:
  - Matthias Brugger <matthias.bgg@gmail.com>

description:
  MT6580 decoder MISC and VLD share a two-page window in the ISP domain.
  Its memory traffic uses LARB1 POST0, CDMA and WDMA ports. The initial
  driver only prepares owned DMA buffers through M4U; the register window,
  interrupt and functional clock describe the hardware, not implemented
  decode job support. This is not compatible with MT8173 V4L2 hardware.

properties:
  compatible:
    const: mediatek,mt6580-vcodec

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: vcodec

  power-domains:
    maxItems: 1

  iommus:
    items:
      - description: LARB1 port 3, decoder POST0
      - description: LARB1 port 9, decoder CDMA
      - description: LARB1 port 10, decoder WDMA

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - iommus

additionalProperties: false
